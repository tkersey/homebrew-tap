name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Test formulae
        id: formulae
        run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Reject skipped or failed formulae
        if: always() && github.event_name == 'pull_request'
        env:
          ALLOWED_SKIPPED_FORMULAE: ''
          SKIPPED_OR_FAILED_FORMULAE: ${{ steps.formulae.outputs.skipped_or_failed_formulae }}
        run: |
          unexpected=''
          for formula in ${SKIPPED_OR_FAILED_FORMULAE}; do
            case " ${ALLOWED_SKIPPED_FORMULAE} " in
              *" ${formula} "*) ;;
              *) unexpected="${unexpected} ${formula}" ;;
            esac
          done
          if [ -n "${unexpected}" ]; then
            echo "::error::Unexpected skipped or failed formulae:${unexpected}"
            exit 1
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@main
        with:
          name: bottles-${{ matrix.os }}
          path: '*.bottle.*'
